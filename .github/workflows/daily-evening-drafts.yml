name: WonderVexa evening draft and motion render

on:
  schedule:
    # 18:15 Nepal time (UTC+5:45).
    - cron: "30 12 * * *"

permissions:
  contents: read

concurrency:
  group: wondervexa-evening-drafts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-evening-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free offline rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install --disable-pip-version-check Pillow
      - name: Restore cross-run topic history
        uses: actions/cache/restore@v4
        with:
          path: output/used_topics.json
          key: wondervexa-topic-history-${{ github.run_id }}
          restore-keys: |
            wondervexa-topic-history-
      - name: Record execution audit
        env:
          SLOT: evening
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: python src/run_audit.py
      - name: Build evening script, SEO metadata and thumbnail draft
        run: |
          python src/content_factory.py --slot evening --date "$(TZ=Asia/Kathmandu date +%F)"
      - name: Build magician-led Episode 01 editorial package
        run: python src/magician_illusion_factory.py --output output/magician-episode-01
      - name: Validate generated draft package
        run: |
          shopt -s nullglob
          packages=(output/drafts/*/metadata.json)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No draft package metadata found."
            exit 1
          fi
          for metadata in "${packages[@]}"; do
            python src/draft_package_check.py "$(dirname "$metadata")"
          done
      - name: Render and technically validate evening short
        run: |
          shopt -s nullglob
          packages=(output/drafts/*/metadata.json)
          for metadata in "${packages[@]}"; do
            package="$(dirname "$metadata")"
            slug="$(basename "$package")"
            video="output/daily-renders/$slug.mp4"
            thumbnail="output/daily-renders/$slug.png"
            python src/motion_graphics_renderer.py --package "$package" --output "$video" --thumbnail "$thumbnail"
            python src/media_quality_check.py --video "$video" --thumbnail "$thumbnail" --require-audio
          done
      - name: Optional attributed RSS research (disabled until sources are approved)
        run: python src/scheduled_research.py --slot evening
      - name: Save updated topic history
        uses: actions/cache/save@v4
        with:
          path: output/used_topics.json
          key: wondervexa-topic-history-${{ github.run_id }}
      - name: Save evening draft and render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wondervexa-evening-${{ github.run_id }}
          path: |
            output/drafts/
            output/daily-renders/
            output/research-stories/
            output/trend-research/
            output/magician-episode-01/
          if-no-files-found: error
          retention-days: 14
