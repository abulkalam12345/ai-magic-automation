name: WonderVexa daily draft and motion render

on:
  schedule:
    # 06:15 Nepal time (UTC+5:45), once per day.
    - cron: "30 0 * * *"
    # 18:15 Nepal time (UTC+5:45), once per day.
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Draft slot
        required: true
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: read

concurrency:
  group: wondervexa-drafts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free offline rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install --disable-pip-version-check Pillow
      - name: Restore cross-run topic history
        uses: actions/cache/restore@v4
        with:
          path: output/used_topics.json
          key: wondervexa-topic-history-${{ github.run_id }}
          restore-keys: |
            wondervexa-topic-history-
      - name: Determine slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_SLOT" != "morning" ] && [ "$INPUT_SLOT" != "evening" ]; then
              echo "Unknown draft slot." >&2
              exit 1
            fi
            echo "value=$INPUT_SLOT" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "30 0 * * *" ]; then
            echo "value=morning" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "30 12 * * *" ]; then
            echo "value=evening" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected schedule; refusing to create a draft." >&2
            exit 1
          fi
      - name: Record execution audit
        env:
          SLOT: ${{ steps.slot.outputs.value }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: python src/run_audit.py
      - name: Build script, SEO metadata and thumbnail draft
        run: |
          python src/content_factory.py --slot "${{ steps.slot.outputs.value }}" --date "$(TZ=Asia/Kathmandu date +%F)"
      - name: Validate every generated draft package
        shell: bash
        run: |
          shopt -s nullglob
          packages=(output/drafts/*/metadata.json)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No draft package metadata found."
            exit 1
          fi
          for metadata in "${packages[@]}"; do
            python src/draft_package_check.py "$(dirname "$metadata")"
          done
      - name: Render and technically validate each daily short
        shell: bash
        run: |
          shopt -s nullglob
          packages=(output/drafts/*/metadata.json)
          for metadata in "${packages[@]}"; do
            package="$(dirname "$metadata")"
            slug="$(basename "$package")"
            video="output/daily-renders/$slug.mp4"
            thumbnail="output/daily-renders/$slug.png"
            python src/motion_graphics_renderer.py --package "$package" --output "$video" --thumbnail "$thumbnail"
            python src/media_quality_check.py --video "$video" --thumbnail "$thumbnail" --require-audio
          done
      - name: Optional attributed RSS research (disabled until sources are approved)
        run: python src/scheduled_research.py --slot "${{ steps.slot.outputs.value }}"
      - name: Save updated topic history
        uses: actions/cache/save@v4
        with:
          path: output/used_topics.json
          key: wondervexa-topic-history-${{ github.run_id }}
      - name: Save draft packages and rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: wondervexa-${{ steps.slot.outputs.value }}-${{ github.run_id }}
          path: |
            output/drafts/
            output/daily-renders/
            output/research-stories/
            output/trend-research/
          if-no-files-found: error
          retention-days: 14
